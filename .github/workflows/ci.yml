name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test Agent and kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.11'
          cache-dependency-path: |
            go.sum
            kernel/oboard-sb/go.sum
      - name: Verify Go modules and vet
        run: |
          go mod verify
          go vet ./...
          (cd kernel/oboard-sb && go mod verify && go vet ./...)
      - name: Run Go race tests
        run: |
          go test -race -shuffle=on ./...
          (cd kernel/oboard-sb && go test -race -shuffle=on ./...)
      - name: Build current-platform binaries
        run: |
          go build ./cmd/agent
          (cd kernel/oboard-sb && go build -tags with_utls ./cmd/oboard-sb)
      - name: Install pinned security scanners
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
      - name: Scan Go code
        run: |
          govulncheck ./...
          (cd kernel/oboard-sb && govulncheck ./...)
          gosec -exclude-generated ./...
          (cd kernel/oboard-sb && gosec -exclude-generated ./...)
          staticcheck -checks=all,-ST1000,-ST1005 ./...
          (cd kernel/oboard-sb && staticcheck -checks=all,-ST1000,-ST1005 ./...)
