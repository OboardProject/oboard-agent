name: Development release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-dev-release
  cancel-in-progress: true

# Verification, the kernel process check, and one build per platform run in
# parallel. Only the publish job holds the signing key: build jobs compile
# unsigned binaries that embed the public key, and publish signs one manifest
# over all of them.
jobs:
  meta:
    name: Compute release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build: ${{ steps.meta.outputs.build }}
      date: ${{ steps.meta.outputs.date }}
      public_key: ${{ steps.key.outputs.public_key }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.7'
          cache-dependency-path: go.sum
      - name: Compute development metadata
        id: meta
        shell: bash
        run: |
          {
            echo "version=dev-${GITHUB_SHA::12}"
            echo "build=$(date -u +%Y%m%d%H%M%S)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - name: Derive release public key
        id: key
        shell: bash
        env:
          OBOARD_RELEASE_SIGNING_KEY: ${{ secrets.OBOARD_RELEASE_SIGNING_KEY }}
        run: |
          test -n "$OBOARD_RELEASE_SIGNING_KEY" || { echo "Configure OBOARD_RELEASE_SIGNING_KEY in the Agent repository" >&2; exit 1; }
          echo "public_key=$(go run ./scripts/print_release_public_key.go)" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.7'
          cache-dependency-path: |
            go.sum
            kernel/oboard-sb/go.sum
      - name: Verify release source before signing
        shell: bash
        run: |
          tools=$(mktemp -d "$RUNNER_TEMP/oboard-verify.XXXXXX")
          cleanup() {
            local status=$?
            if ! chmod -R u+w "$tools" || ! rm -rf "$tools"; then
              echo 'Failed to clean verification tools' >&2
              if [ "$status" -eq 0 ]; then status=1; fi
            fi
            exit "$status"
          }
          trap cleanup EXIT
          export CGO_ENABLED=0 GOWORK=off GOBIN="$tools/bin" GOCACHE="$tools/go" GOMODCACHE="$tools/mod" GOTMPDIR="$tools/tmp"
          mkdir -p "$GOBIN" "$GOCACHE" "$GOMODCACHE" "$GOTMPDIR"
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          export PATH="$GOBIN:$PATH" OBOARD_VERIFY_CACHE_ROOT="$tools/verify"
          ./scripts/test-verify-release.sh
          ./scripts/verify-release.sh

  process-faults:
    name: Verify real kernel process recovery
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.7'
          cache-dependency-path: |
            go.sum
            kernel/oboard-sb/go.sum
      - name: Verify real kernel process recovery
        shell: bash
        run: |
          scope=$(mktemp -d "$RUNNER_TEMP/oboard-process.XXXXXX")
          cleanup() { result=$?; chmod -R u+w "$scope" && rm -rf "$scope" || result=1; exit "$result"; }
          trap cleanup EXIT
          export OBOARD_PROCESS_WORKSPACE="$scope"
          export OBOARD_PROCESS_KERNEL="$scope/dist/process-fixtures/old/oboard-sb"
          export OBOARD_PROCESS_KERNEL_NEXT="$scope/dist/process-fixtures/next/oboard-sb"
          export OBOARD_PROCESS_MANIFEST="$scope/dist/process-fixtures/manifest.json"
          export GOCACHE="$scope/go" GOMODCACHE="$scope/mod" GOTMPDIR="$scope/tmp" TMPDIR="$scope/tmp"
          mkdir -p "$GOCACHE" "$GOMODCACHE" "$GOTMPDIR"
          bash scripts/build-process-fixtures.sh
          bash scripts/verify-process-faults.sh --all

  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
          - { os: windows, arch: amd64 }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.7'
          cache-dependency-path: |
            go.sum
            kernel/oboard-sb/go.sum
      - name: Build unsigned release binaries
        env:
          OBOARD_RELEASE_STAGE: build
          OBOARD_PLATFORMS: ${{ matrix.os }}/${{ matrix.arch }}
          OBOARD_RELEASE_PUBLIC_KEY: ${{ needs.meta.outputs.public_key }}
          VERSION: ${{ needs.meta.outputs.version }}
          BUILD: ${{ needs.meta.outputs.build }}
          COMMIT: ${{ github.sha }}
          DATE: ${{ needs.meta.outputs.date }}
        run: ./scripts/build-release.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/release/oboard-*-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish mutable development release
    needs: [meta, verify, process-faults, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.7'
          cache-dependency-path: |
            go.sum
            kernel/oboard-sb/go.sum
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agent-*
          path: dist/release
          merge-multiple: true
      - name: Sign Agent release manifest
        env:
          OBOARD_RELEASE_STAGE: package
          OBOARD_RELEASE_SIGNING_KEY: ${{ secrets.OBOARD_RELEASE_SIGNING_KEY }}
          OBOARD_RELEASE_PUBLIC_KEY: ${{ needs.meta.outputs.public_key }}
          VERSION: ${{ needs.meta.outputs.version }}
          BUILD: ${{ needs.meta.outputs.build }}
          COMMIT: ${{ github.sha }}
          DATE: ${{ needs.meta.outputs.date }}
        run: ./scripts/build-release.sh
      - name: Move development tag
        run: |
          git config user.name OboardProject
          git config user.email OboardProject@users.noreply.github.com
          git tag -f dev "$GITHUB_SHA"
          git push origin refs/tags/dev --force
      - name: Publish development GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=()
          while IFS= read -r name; do assets+=("dist/release/$name"); done < <(python3 -c 'import json;[print(f["name"]) for f in json.load(open("dist/release/release-manifest.json"))["files"]]')
          assets+=(dist/release/release-manifest.json dist/release/release-manifest.json.sig dist/release/sha256sums.txt)
          for asset in "${assets[@]}"; do
            test -f "$asset" || { echo "Release asset $asset declared by the manifest is missing" >&2; exit 1; }
          done
          resource_tag=$(python3 -c 'import json; m=json.load(open("dist/release/release-manifest.json")); print(m["version"] + "-" + m["build"])')
          gh release create "$resource_tag" "${assets[@]}" --title "OBoard Agent $resource_tag" --prerelease --latest=false --target "$GITHUB_SHA"
          if gh release view dev >/dev/null 2>&1; then
            gh release upload dev "${assets[@]}" --clobber
            gh release edit dev --title "OBoard Agent development" --prerelease --target "$GITHUB_SHA"
          else
            gh release create dev "${assets[@]}" --title "OBoard Agent development" --prerelease --target "$GITHUB_SHA"
          fi
